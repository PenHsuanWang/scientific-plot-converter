name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # triggers on v1.2.3, v0.1.0, etc.

jobs:
  # ── Guard: full lint + test must pass before releasing ────────────────────
  ci:
    name: Verify (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so tox can inspect tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Lint
        run: tox -e lint
      - name: Test
        run: tox -e test

  # ── Build: produce sdist + wheel ──────────────────────────────────────────
  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── Release: create GitHub Release with dist artifacts ────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write    # required to create releases and upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "${VERSION}" dist/* \
            --title "Release ${VERSION}" \
            --generate-notes
