name: CI

on:
  push:
    branches: ["dev", "master"]
  pull_request:
    branches: ["dev", "master"]

jobs:
  # ── Job 1: pre-commit hooks (format, style, docstrings, types) ─────────────
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and dev dependencies
        # Required so the `language: system` mypy hook can resolve imports.
        run: pip install -e ".[dev]"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run all pre-commit hooks
        run: pre-commit run --all-files

  # ── Job 2: tox matrix (lint + test) ───────────────────────────────────────
  tox:
    name: Tox / ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tox-env: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tox
        run: pip install tox
      - name: Run tox
        run: tox -e ${{ matrix.tox-env }}
