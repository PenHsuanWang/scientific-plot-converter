[project]
name = "fabplot-cli"
version = "0.1.0"
description = "A standardized Python CLI utility to generate publication-quality, 'Scientific-Grade' visualizations from Fab CSV data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "polars>=0.20.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0"
]

[project.scripts]
fabplot = "fabplot.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "sphinx>=7.2.6",
    "ruff>=0.2.2",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "tox>=4.14.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
