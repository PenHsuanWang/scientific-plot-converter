[tox]
envlist = lint, test
isolated_build = true

# ── Lint environment: ruff + flake8 + mypy ───────────────────────────────────
[testenv:lint]
extras = dev
commands =
    ruff check src tests
    flake8 src tests
    mypy src

# ── Test environment: pytest with coverage ───────────────────────────────────
[testenv:test]
extras = dev
commands =
    pytest {posargs:tests} --cov=dsprinter --cov-report=term-missing
